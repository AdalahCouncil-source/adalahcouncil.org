<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" aria-label="A minbar beneath a pointed arch">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2f4560"/><stop offset="1" stop-color="#17191e"/>
    </linearGradient>
    <radialGradient id="glow" cx="390" cy="330" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e7c98f" stop-opacity=".32"/>
      <stop offset=".5" stop-color="#e7c98f" stop-opacity=".08"/>
      <stop offset="1" stop-color="#e7c98f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3dfb4" stop-opacity=".95"/><stop offset="1" stop-color="#c79a57" stop-opacity=".8"/>
    </linearGradient>
    <pattern id="star" width="60" height="60" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#e3e2dd" stroke-width="1">
        <rect x="17" y="17" width="26" height="26"/><path d="M30 11.6 48.4 30 30 48.4 11.6 30Z"/>
      </g>
    </pattern>
    <pattern id="lattice" width="24" height="24" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#e3e2dd" stroke-width="1"><rect x="7" y="7" width="10" height="10"/><path d="M12 4.9 19.1 12 12 19.1 4.9 12Z"/></g>
    </pattern>
    <clipPath id="niche"><path d="M188 690V344C188 262 250 218 300 174C350 218 412 262 412 344V690Z"/></clipPath>
    <clipPath id="side"><polygon points="250,690 250,600 250,580 265,580 265,560 280,560 280,540 295,540 295,520 310,520 310,500 325,500 325,480 340,480 340,460 355,460 355,440 370,440 410,440 410,690"/></clipPath>
  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>
  <rect width="600" height="800" fill="url(#star)" opacity=".055"/>
  <g clip-path="url(#niche)">
    <rect width="600" height="800" fill="#101216" opacity=".35"/>
    <rect width="600" height="800" fill="url(#glow)"/>
  </g>
  <g fill="none" stroke="#e3e2dd" stroke-linejoin="round">
    <path d="M170 690V340C170 250 240 200 300 150C360 200 430 250 430 340V690" stroke-width="2" opacity=".55"/>
    <path d="M188 690V344C188 262 250 218 300 174C350 218 412 262 412 344V690" stroke-width="1" opacity=".35"/>
    <path d="M120 690H480" stroke-width="1.2" opacity=".35"/>
    <path d="M150 704H450" stroke-width="1" opacity=".18"/>
  </g>
  <!-- minbar side panel -->
  <g clip-path="url(#side)"><rect x="240" y="400" width="180" height="300" fill="url(#lattice)" opacity=".13"/></g>
  <polygon points="250,690 250,600 250,580 265,580 265,560 280,560 280,540 295,540 295,520 310,520 310,500 325,500 325,480 340,480 340,460 355,460 355,440 370,440 410,440 410,690" fill="none" stroke="#e3e2dd" stroke-width="1.6" stroke-linejoin="round" opacity=".75"/>
  <!-- gate -->
  <path d="M212 690V600C212 584 222 574 231 566C240 574 250 584 250 600V690" fill="#17191e" fill-opacity=".55" stroke="#e3e2dd" stroke-width="1.6" stroke-linejoin="round" opacity=".8"/>
  <!-- railing and balusters -->
  <g stroke="#e3e2dd" stroke-linecap="round" fill="none" opacity=".6">
    <path d="M250 566 370 406" stroke-width="1.6"/>
    <g stroke-width="1"><path d="M257.5 580 V556.0"/><path d="M272.5 560 V536.0"/><path d="M287.5 540 V516.0"/><path d="M302.5 520 V496.0"/><path d="M317.5 500 V476.0"/><path d="M332.5 480 V456.0"/><path d="M347.5 460 V436.0"/><path d="M362.5 440 V416.0"/></g>
  </g>
  <!-- canopy -->
  <g stroke="#e3e2dd" stroke-linecap="round" fill="none" opacity=".75">
    <path d="M374 440V364M406 440V364" stroke-width="1.6"/>
    <path d="M368 364H412" stroke-width="2"/>
  </g>
  <path d="M370 364C370 336 384 318 390 304C396 318 410 336 410 364Z" fill="url(#gold)" stroke="#f1e6cc" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="M390 304V290" stroke="#e7c98f" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="390" cy="287" r="3.2" fill="#e7c98f"/>
</svg>
