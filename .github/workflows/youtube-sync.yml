name: Sync YouTube uploads

on:
  schedule:
    - cron: "17 */6 * * *"     # about every 6 hours
  workflow_dispatch:           # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write              # save the updated video lists
  pages: write                 # ask GitHub Pages to rebuild the site

concurrency:
  group: youtube-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the channel for new uploads
        run: python3 .github/scripts/sync_youtube.py

      - name: Save changes
        id: save
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing new."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add _data/videos.yml _data/shorts.yml .github/youtube-seen.txt
          git commit -m "Add new YouTube uploads"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild the site
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages will rebuild on its own."
