media:
  input: assets/uploads
  output: /assets/uploads

content:
  - name: guides
    label: Guides
    type: collection
    path: _guides
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: create
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: deck
        label: Summary (one or two sentences shown under the title and in search results)
        type: text
      - name: date
        label: Date
        type: date
        required: true
      - name: type
        label: Type
        type: select
        options:
          values: [Essay, Research, Guidance, Statement, Announcement]
      - name: author
        label: Author
        type: string
        default: Adalah Council
      - name: lead
        label: Feature this guide at the top of the Guides page
        type: boolean
        default: false
      - name: image
        label: Cover picture (optional; shown on the Guides page when this is the featured guide, and as the preview when the article is shared; tall pictures work best, 3:4; use JPG or PNG)
        type: image
      - name: pdf
        label: PDF version (optional)
        type: file
        options:
          extensions: [pdf]
      - name: author_bio
        label: Author bio (optional, one or two sentences shown at the end of the article)
        type: text
      - name: published
        label: Published (turn off to keep it hidden as a draft)
        type: boolean
        default: true
      - name: layout
        type: string
        default: article
        hidden: true
      - name: wide
        type: boolean
        hidden: true
      - name: include
        type: string
        hidden: true
      - name: share_image
        type: string
        hidden: true
      - name: body
        label: Guide text
        type: rich-text

  - name: articles
    label: Journal articles
    type: collection
    path: _articles
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: create
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: deck
        label: Summary (one or two sentences shown under the title and in search results)
        type: text
      - name: date
        label: Date
        type: date
        required: true
      - name: type
        label: Type
        type: select
        options:
          values: [Essay, Research, Guidance, Statement, Announcement]
      - name: author
        label: Author
        type: string
        default: Adalah Council
      - name: issue
        label: Issue (for example Volume 1, Issue 1). Type it exactly the same for every article in that issue.
        type: string
      - name: lead
        label: Feature this as the lead article of its issue
        type: boolean
        default: false
      - name: image
        label: Cover picture (optional; shown on the Journal page when this is the featured article, and as the preview when the article is shared; tall pictures work best, 3:4; use JPG or PNG)
        type: image
      - name: pdf
        label: PDF version (optional)
        type: file
        options:
          extensions: [pdf]
      - name: author_bio
        label: Author bio (optional, one or two sentences shown at the end of the article)
        type: text
      - name: published
        label: Published (turn off to keep it hidden as a draft)
        type: boolean
        default: true
      - name: layout
        type: string
        default: article
        hidden: true
      - name: wide
        type: boolean
        hidden: true
      - name: include
        type: string
        hidden: true
      - name: share_image
        type: string
        hidden: true
      - name: body
        label: Article text
        type: rich-text

  - name: videos
    label: Videos
    type: file
    path: _data/videos.yml
    format: yaml
    list: true
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: topic
        label: Topic (optional, for example Law, Ethics, Education; adds a filter button on the Media page)
        type: string
      - name: youtube
        label: YouTube link (paste the full link)
        type: string
      - name: description
        label: Description (optional)
        type: text
      - name: featured
        label: Feature this video at the top of the Media page (stays featured when new videos upload; if several are switched on, the highest in the list wins)
        type: boolean
        default: false

  - name: shorts
    label: Shorts
    type: file
    path: _data/shorts.yml
    format: yaml
    list: true
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: youtube
        label: YouTube Shorts link (paste the full link)
        type: string

  - name: journal
    label: Journal settings
    type: file
    path: _data/journal.yml
    format: yaml
    fields:
      - name: title
        label: Journal name
        type: string
        required: true
      - name: subtitle
        label: Subtitle
        type: string
      - name: about
        label: About the journal (short paragraph shown at the bottom of the Journal page)
        type: text
      - name: submissions_email
        label: Email for submissions
        type: string
