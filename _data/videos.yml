- title: Is Wearing a Turban REALLY Sunnah? (What Sunnah Actually Means)
  speaker: Farhan Siddiqi
  date: "2026"
  duration: "10"
  topic: All
  youtube: https://www.youtube.com/watch?v=3vt7C4WiNcw
  description: >-
    The word "Sunnah" gets used constantly — but what does it actually mean, and
    how do we apply it correctly? In this video, Imam Farhan Siddiqi breaks down
    the true meaning of Sunnah and answers a commonly asked question: is wearing
    a turban considered Sunnah?


    We explore the difference between acts of worship that carry religious
    weight and cultural practices from the Prophet's ﷺ time, so you can better
    understand how to approach this topic with clarity.


    🎥 Filmed & produced by @Lightstud1o (Instagram)

    🔔 Subscribe for more content exploring Islamic knowledge.

    ____________________________________________________________

    Timestamps


    0:00 – Intro: Is the Turban Really Sunnah?

    1:01 – The 4 Meanings of "Sunnah" (Hadith vs. Legal vs. Fiqh vs.
    Methodology)

    2:39 – Were All the Prophet's ﷺ Actions Legislation? (5 Types of Acts)

    4:21 – 7-Point Checklist: Legislated Sunnah vs. Cultural Custom

    5:53 – Turban Hadiths Examined (Sahih, Weak & Fabricated Narrations)

    8:02 – Following Out of Love vs. Legislated Reward (Final Ruling)



