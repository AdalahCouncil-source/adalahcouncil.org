  description: >-
    The Prophet ﷺ said this ummah would divide into 73 sects. Many of us were
    taught that this means only our group is saved and everyone else is in the
    Fire. But what did he actually say, through which chain, and how strong is
    it?


    In this episode of Misplaced Piety, we ask who Ahl al-Sunnah wa’l-Jamāʿah
    really are, and why the name carries two obligations at once: fidelity to
    the Sunnah, and refusal to tear apart the body of the Muslims.

