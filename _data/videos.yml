- title: Is Music Really Haram? The Evidence From Both Sides
  speaker: Farhan Siddiqi
  date: "2026"
  duration: "22"
  topic: Ethics
  youtube: https://www.youtube.com/watch?v=jVWbQpqMwVQ
  description: >-
    Is music haram? Most people have heard one of two confident answers. This
    video asks a different question: what does the evidence actually settle, and
    what does it leave open?


    First, we build the case for prohibition at full strength: the four imams,
    the hadith of al-maʿāzif in Ṣaḥīḥ al-Bukhārī, the early generations and the
    Qur’anic evidence. Then we build the case for qualified permissibility the
    same way. Finally, we show the five exact places where the two positions
    part ways.


    No ruling is given. What’s left is what Islamic law calls khilāf muʿtabar, a
    valid disagreement.


    And Allah knows best.


    Shot & Edited by @Lightstud1o (Instagram)

